# Full NairaChain stack: Postgres + API + web.
#   cp .env.example .env   # set JWT secrets
#   docker compose up -d --build
#   docker compose run --rm -e NODE_ENV=development api node src/db/seed.js   # optional demo data
# For just a local database (running the apps with npm): docker compose up -d db

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nairachain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nairachain}
      POSTGRES_DB: ${POSTGRES_DB:-nairachain}
      POSTGRES_INITDB_ARGS: --encoding=UTF8
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nairachain} -d ${POSTGRES_DB:-nairachain}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    image: nairachain-api:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-nairachain}:${POSTGRES_PASSWORD:-nairachain}@db:5432/${POSTGRES_DB:-nairachain}
      DATABASE_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ESCROW_TIMEOUT_MINUTES: ${ESCROW_TIMEOUT_MINUTES:-30}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-NairaChain <noreply@nairachain.com>}
      RUN_MIGRATIONS: "true"
    ports:
      - "5000:5000"

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:5000/api}
        NEXT_PUBLIC_SOCKET_URL: ${PUBLIC_SOCKET_URL:-http://localhost:5000}
    image: nairachain-web:latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  pgdata:
