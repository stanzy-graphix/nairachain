services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nairachain
      POSTGRES_PASSWORD: nairachain
      POSTGRES_DB: nairachain
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nairachain"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
